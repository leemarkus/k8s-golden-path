apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/gitops.git
    targetRevision: deploy
    path: clusters/homelab/tenant-namespaces
  destination:
    server: https://kubernetes.default.svc
  # Namespace deletion and budget changes require an explicit human sync.
  # No finalizer: decommission is deliberate and preservation is the default.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
